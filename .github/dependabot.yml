# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2

updates:
  # Frontend npm dependencies. This is a pnpm workspace: the single
  # pnpm-lock.yaml lives at the repo root, so Dependabot must run from the
  # workspace root — a subdirectory entry bumps only frontend/package.json
  # and the PR then fails CI's `pnpm install --frozen-lockfile`
  # (dependabot-core#11135).
  - package-ecosystem: "npm"
    directory: "/" # workspace root; covers frontend/package.json + root pnpm-lock.yaml
    schedule:
      interval: "weekly"

  # Configuration for Rust/Cargo dependencies
  - package-ecosystem: "cargo"
    directory: "/ichor/" # Adjust if your Cargo.toml is in a subdirectory
    schedule:
      interval: "weekly"
