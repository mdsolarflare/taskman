# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2

updates:
  # Configuration for frontend npm dependencies (pnpm workspace package;
  # dependabot reads pnpm-lock.yaml for the "npm" ecosystem)
  - package-ecosystem: "npm"
    directory: "/frontend/" # pnpm workspace package
    schedule:
      interval: "weekly"

  # Configuration for Rust/Cargo dependencies
  - package-ecosystem: "cargo"
    directory: "/ichor/" # Adjust if your Cargo.toml is in a subdirectory
    schedule:
      interval: "weekly"
