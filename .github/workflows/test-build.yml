name: Run project build & tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # ─── Rust (ichor) ─────────────────────────────────────────────

      - name: Lint Rust
        run: cargo check --manifest-path ichor/Cargo.toml

      - name: Build Rust
        run: cargo build --verbose --manifest-path ichor/Cargo.toml

      - name: Test Rust
        run: cargo test --verbose --manifest-path ichor/Cargo.toml

      - name: Install wasm-pack
        run: cargo install wasm-pack --version 0.15.0

      #- name: Install audit
      #  run: cargo install cargo-audit
      #
      #- name: Run audit TODO manifest-path doesn't work
      #  run: cargo audit --manifest-path ichor/Cargo.toml

      - name: Build WASM
        run: wasm-pack build --release ichor --target web

      # ─── TypeScript (frontend) ────────────────────────────────────

      # Install pnpm (version pinned via the packageManager field) + Node
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node Environment
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.7.0 # Pinned exact version
          cache: pnpm # Caches the pnpm store based on pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Vendor WASM glue files
        run: pnpm --dir frontend vendor-wasm

      - name: Verify formatting and styles
        run: pnpm --dir frontend fmt:check

      - name: Lint TypeScript
        run: pnpm --dir frontend lint

      - name: Run Typescript Tests
        run: pnpm --dir frontend test

      - name: Build Frontend (production)
        run: pnpm --dir frontend build
