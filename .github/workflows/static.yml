# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # ─── Rust (ichor) ─────────────────────────────────────────────

      - name: Lint Rust
        run: cargo check --manifest-path ichor/Cargo.toml

      - name: Build Rust
        run: cargo build --verbose --manifest-path ichor/Cargo.toml

      - name: Test Rust
        run: cargo test --verbose --manifest-path ichor/Cargo.toml

      - name: Install wasm-pack
        run: cargo install wasm-pack --version 0.15.0

      #- name: Install audit
      #  run: cargo install cargo-audit
      #
      #- name: Run audit TODO manifest-path doesn't work
      #  run: cargo audit --manifest-path ichor/Cargo.toml

      - name: Build WASM
        run: wasm-pack build --release ichor --target web

      # ─── TypeScript (frontend) ────────────────────────────────────

      # Install pnpm (version pinned via the packageManager field) + Node
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node Environment
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.7.0 # Pinned exact version
          cache: pnpm # Caches the pnpm store based on pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Vendor WASM glue files
        run: pnpm --dir frontend vendor-wasm

      - name: Verify formatting and styles
        run: pnpm --dir frontend fmt:check

      - name: Lint TypeScript
        run: pnpm --dir frontend lint

      - name: Run Typescript Tests
        run: pnpm --dir frontend test

      - name: Build Frontend - Includes type checking
        run: pnpm --dir frontend build
      - name: Setup Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          # Upload entire repository
          path: 'frontend/public'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
